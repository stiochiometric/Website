<?xml version="1.0" encoding="utf-8"?>
<!-- clock.svg
     Dynamic SVG clock converted from a canvas example.
     Save as clock.svg and open in a browser. Note: embedded <script> can be removed/stripped by some MD renderers.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512"
     preserveAspectRatio="xMidYMid meet">

  <desc>Animated SVG clock with hour, minute and smooth second hands.</desc>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style type="text/css"><![CDATA[
      .bg { fill: #111; }
      .rim { fill: #c0c0c0; }
      .face { fill: #000; }
      .majorTick { stroke: #00eaff; stroke-width: 3; stroke-linecap: round; }
      .minorTick { stroke: rgba(0,200,255,0.45); stroke-width: 1; stroke-linecap: round; }
      .nums { fill: #00eaff; font-family: sans-serif; font-weight: 600; font-size: 20px; text-anchor: middle; dominant-baseline: middle; }
      .hourHand { fill: #c0c0c0; }
      .minuteHand { fill: #00eaff; }
      .secondHand { stroke: #ff6b6b; stroke-width: 2; stroke-linecap: round; }
      .centerCap { fill: #fff; }
      .timeLabel { fill: #ffffff; font-family: sans-serif; font-size: 14px; text-anchor: middle; }
    ]]></style>
  </defs>

  <!-- background (optional) -->
  <rect width="100%" height="100%" class="bg" />

  <!-- center transform group: put origin at 256,256 -->
  <g id="clock" transform="translate(256,256)">

    <!-- rim glow -->
    <circle r="210" class="rim" filter="url(#glow)" />

    <!-- face -->
    <circle r="180" class="face" />

    <!-- concentric rings -->
    <g id="rings" stroke="rgba(0,200,255,0.12)" fill="none">
      <circle r="30" />
      <circle r="60" />
      <circle r="90" />
      <circle r="120" />
      <circle r="150" />
    </g>

    <!-- 12 major ticks (hours) -->
    <g id="majorTicks">
      <!-- draw using rotation groups for clarity -->
      <g transform="rotate(0)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(30)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(60)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(90)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(120)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(150)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(180)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(210)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(240)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(270)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(300)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
      <g transform="rotate(330)"><line class="majorTick" x1="0" y1="-140" x2="0" y2="-170"/></g>
    </g>

    <!-- minor ticks (every 6 degrees) -->
    <g id="minorTicks">
      <!-- we generate a subset for readability; full 60 can be added similarly -->
      <g transform="rotate(6)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(12)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(18)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(24)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>

      <g transform="rotate(36)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(42)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(48)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(54)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>

      <g transform="rotate(66)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(72)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(78)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>
      <g transform="rotate(84)"><line class="minorTick" x1="0" y1="-146" x2="0" y2="-170"/></g>

      <!-- (repeat similarly to complete 60 if needed) -->
    </g>

    <!-- numerals -->
    <g id="numbers" class="nums">
      <text x="0"   y="-115">12</text>
      <text x="75"  y="-92">1</text>
      <text x="115" y="-45">2</text>
      <text x="140" y="0">3</text>
      <text x="115" y="45">4</text>
      <text x="75"  y="92">5</text>
      <text x="0"   y="115">6</text>
      <text x="-75" y="92">7</text>
      <text x="-115" y="45">8</text>
      <text x="-140" y="0">9</text>
      <text x="-115" y="-45">10</text>
      <text x="-75"  y="-92">11</text>
    </g>

    <!-- hour hand group (rotate the group) -->
    <g id="hourHand" transform="rotate(0)">
      <!-- hour hand path centered at origin, pointing upward initially -->
      <path class="hourHand" d="M -8 0 L -6 -60 L 0 -75 L 6 -60 L 8 0 Z" />
    </g>

    <!-- minute hand group -->
    <g id="minuteHand" transform="rotate(0)">
      <path class="minuteHand" d="M -6 0 L -4 -95 L 0 -115 L 4 -95 L 6 0 Z" />
    </g>

    <!-- second hand group -->
    <g id="secondHand" transform="rotate(0)">
      <line class="secondHand" x1="0" y1="10" x2="0" y2="-150" />
    </g>

    <!-- center cap -->
    <circle r="8" class="centerCap" />

    <!-- time label under the clock -->
    <text id="timeText" class="timeLabel" x="0" y="180">--:--:--</text>

  </g>

  <!-- embedded script for animation -->
  <script><![CDATA[
    (function () {
      // get elements
      const hourG = document.getElementById('hourHand');
      const minuteG = document.getElementById('minuteHand');
      const secondG = document.getElementById('secondHand');
      const timeText = document.getElementById('timeText');

      // compute angles (degrees)
      function computeAngles(d) {
        const H = d.getHours();
        const M = d.getMinutes();
        const S = d.getSeconds();
        const MS = d.getMilliseconds();
        // fraction seconds including ms for smooth second hand
        const Sf = S + (MS / 1000);
        const minuteAngle = ((M + Sf / 60) / 60) * 360; // 0..360
        const hourAngle = (((H % 12) + (M / 60) + (Sf / 3600)) / 12) * 360;
        const secondAngle = (Sf / 60) * 360;
        return { hourAngle, minuteAngle, secondAngle, H, M, S };
      }

      // apply rotation: since our groups are located at center, rotate(angle) suffices
      function applyAngles(a) {
        if (hourG) hourG.setAttribute('transform', 'rotate(' + a.hourAngle + ')');
        if (minuteG) minuteG.setAttribute('transform', 'rotate(' + a.minuteAngle + ')');
        if (secondG) secondG.setAttribute('transform', 'rotate(' + a.secondAngle + ')');
        if (timeText) {
          const hh = String(a.H).padStart(2, '0');
          const mm = String(a.M).padStart(2, '0');
          const ss = String(a.S).padStart(2, '0');
          timeText.textContent = hh + ':' + mm + ':' + ss;
        }
      }

      // smooth animation via requestAnimationFrame
      let lastMinute = (new Date()).getMinutes();
      function tick() {
        const now = new Date();
        const a = computeAngles(now);
        applyAngles(a);
        // update more frequently for smooth seconds
        requestAnimationFrame(tick);
      }

      // start
      tick();

      // ensure sync when tab becomes visible again
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          const now = new Date();
          applyAngles(computeAngles(now));
        }
      });
    })();
  ]]></script>

</svg>
