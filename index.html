<!doctype html>
<html>
<head>
<meta charset="utf-8" />

  <!-- in your hosted HTML <head> -->
<meta property="og:title" content="My Live Clock">
<meta property="og:description" content="Click to open the animated clock">
<meta property="og:image" content="https://stiochiometric.github.io/Website/og-clock-thumbnail.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://stiochiometric.github.io/Website/index.html">

<title>Canvas Clock</title>
<style>
  html,body { height:100%; margin:0; display:flex; align-items:center; justify-content:center; background:#111; }
  canvas { border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const cx = c.width/2, cy = c.height/2, radius = 200;

function draw(now) {
  //const d = new Date(now || Date.now());
  const d = Date.now();
  const H = d.getHours(), M = d.getMinutes(), S = d.getSeconds() + d.getMilliseconds()/1000;
  ctx.clearRect(0,0,c.width,c.height);

  // face
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx,cy,radius+10,0,Math.PI*2); ctx.fill();

  // rings
  ctx.strokeStyle = 'rgba(0,200,255,0.12)';
  for(let i=1;i<=6;i++){ ctx.beginPath(); ctx.arc(cx,cy,(radius/6)*i,0,Math.PI*2); ctx.stroke(); }

  // numbers
  ctx.fillStyle = '#00eaff';
  ctx.font = '28px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let h=1; h<=12; h++){
    const ang = (h * Math.PI*2/12) - Math.PI/2;
    const x = cx + Math.cos(ang) * (radius*0.75);
    const y = cy + Math.sin(ang) * (radius*0.75);
    ctx.fillText(h, x, y);
  }

  // hands (hour/minute/second)
  const minuteAngle = (M + S/60)/60 * Math.PI*2;
  const hourAngle = ((H%12) + M/60 + S/3600)/12 * Math.PI*2;
  const secondAngle = S/60 * Math.PI*2;

  // hour hand
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(hourAngle )//+ Math.PI / 2);
  ctx.fillStyle = '#3b2f2f';
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(-8, -radius * 0.46);
  ctx.lineTo(0, -radius * 0.55);
  ctx.lineTo(8, -radius * 0.46);
  ctx.lineTo(12, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // minute hand
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(minuteAngle )//+ Math.PI / 2);
  ctx.fillStyle =  '#2b2b2b';
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.lineTo(-6, -radius * 0.72);
  ctx.lineTo(0, -radius * 0.82);
  ctx.lineTo(6, -radius * 0.72);
  ctx.lineTo(8, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // second (thin)
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(secondAngle )//- Math.PI/2);
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(0,-radius*0.82); ctx.stroke();
  ctx.restore();

  // center
  ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
